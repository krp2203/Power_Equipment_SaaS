version: '3.8'

services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: dealer_dashboard
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # IMPORTANT (two separate, both real, both confirmed on this exact stack):
  # 1. `docker restart <container>` / `docker compose restart worker` reuses
  #    the same container hostname, which can leave the next process's
  #    Celery mingle handshake stuck waiting on stale presence data Redis
  #    still has for the dead one - the worker never crashes, it just
  #    silently stops consuming. Redeploy with
  #    `docker compose up -d --force-recreate worker` (see
  #    scripts/restart_worker.sh) instead of a plain restart.
  # 2. Independent of #1: this Celery/kombu/redis-py combination can hang
  #    the worker's main connection inside the gossip bootstep's pidbox
  #    BRPOP loop and never reach the real task queue at all, even on a
  #    freshly-recreated container with a brand-new hostname - reproduced
  #    directly (redis MONITOR showed the worker's only BRPOP looping
  #    forever against `<id>.reply.celery.pidbox`, never once against
  #    `celery`, the real task list). --without-gossip/-mingle/-heartbeat
  #    below sidesteps it entirely; none of the three do anything useful for
  #    a single-worker deployment like this one anyway (gossip/mingle are
  #    for multi-worker awareness, heartbeat is for Flower/`celery events`,
  #    none of which this app uses). This is also why `celery inspect`/
  #    `celery status` no longer work against this worker - they rely on
  #    the same pidbox mechanism - hence the healthcheck below uses a real
  #    task round-trip instead.
  worker:
    image: python:3.11-slim
    restart: unless-stopped
    working_dir: /app
    # NO FFmpeg installation - PIL fallback used in code
    command: sh -c "pip install -q --no-cache-dir -r requirements.txt && celery -A celery_worker.celery worker --loglevel=info --without-gossip --without-mingle --without-heartbeat"
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - FLASK_CONFIG=prod
      - DB_URI=postgresql://user:password@db:5432/dealer_dashboard
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # Not `celery inspect ping` - with gossip disabled above it can no
      # longer answer pidbox broadcasts at all, and even before that change
      # it was an unreliable signal here (confirmed: it reported a worker
      # unhealthy in production while that same worker was demonstrably,
      # verifiably draining its queue at the time). Proves the one thing
      # that actually matters instead: a real task queued right now gets a
      # real result back.
      test: ["CMD-SHELL", "python -c 'from celery_worker import debug_task; debug_task.delay().get(timeout=13)'"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 90s

  beat:
    image: python:3.11-slim
    restart: unless-stopped
    working_dir: /app
    # NO FFmpeg installation - PIL fallback used in code
    command: sh -c "pip install -q --no-cache-dir -r requirements.txt && celery -A celery_worker.celery beat --loglevel=info"
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - FLASK_CONFIG=prod
      - DB_URI=postgresql://user:password@db:5432/dealer_dashboard
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    image: python:3.11-slim
    restart: unless-stopped
    working_dir: /app
    # NO FFmpeg installation - PIL fallback used in code
    command: sh -c "pip install -q --no-cache-dir -r requirements.txt && gunicorn --bind 0.0.0.0:5000 run:app"
    volumes:
      - .:/app
    ports:
      - "8005:5000"
    env_file:
      - .env
    environment:
      - FLASK_CONFIG=prod
      - DB_URI=postgresql://user:password@db:5432/dealer_dashboard
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    image: node:20
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./dealer_frontend_next:/app
    ports:
      - "3005:3000"
    command: sh -c "npm run build && npm run start"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=/api/v1
    depends_on:
      - web

  # NGINX - Handles multi-tenancy with subdomains
  nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx_test.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
      - frontend
    networks:
      - default

volumes:
  postgres_data:

networks:
  default:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: "1400"
