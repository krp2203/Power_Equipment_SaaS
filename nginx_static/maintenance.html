<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="15">
<title>Site Maintenance</title>
<style>
    html, body {
        margin: 0;
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background: #f4f6f8;
        color: #2c3e50;
    }
    .wrap {
        min-height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        box-sizing: border-box;
    }
    .card {
        max-width: 480px;
        text-align: center;
        background: #fff;
        border-radius: 12px;
        padding: 40px 32px;
        box-shadow: 0 2px 16px rgba(0, 0, 0, 0.08);
    }
    .icon {
        font-size: 40px;
        margin-bottom: 8px;
    }
    h1 {
        font-size: 22px;
        margin: 0 0 12px;
    }
    p {
        font-size: 15px;
        line-height: 1.6;
        color: #5a6b7a;
        margin: 0;
    }
</style>
</head>
<body>
    <div class="wrap">
        <div class="card">
            <div class="icon">&#128295;</div>
            <h1>Sorry for the inconvenience</h1>
            <p>This site is down for maintenance. Please try back in a few minutes and refresh the page - we'll be back shortly.</p>
        </div>
    </div>
</body>
</html>
