services:
  web:
    build: .
    restart: unless-stopped
    command: sh -c "pip install gevent && gunicorn -c gunicorn.conf.py run:app"
    volumes:
      - .:/app
    ports:
      - "8005:5000"
    env_file:
      - .env
    environment:
      - FLASK_CONFIG=prod
      - SQUARE_ACCESS_TOKEN=${SQUARE_ACCESS_TOKEN}
      - SQUARE_APP_ID=${SQUARE_APP_ID}
      - SQUARE_LOCATION_ID=${SQUARE_LOCATION_ID}
      - SQUARE_ENVIRONMENT=${SQUARE_ENVIRONMENT}
    depends_on:
      - db
      - redis

  # IMPORTANT: `docker compose restart worker` reuses the same container
  # hostname, which can leave the next process's Celery mingle handshake
  # stuck waiting on stale presence data Redis still has for the dead one -
  # the worker never crashes, it just silently stops consuming. Always
  # redeploy the worker with `docker compose up -d --force-recreate worker`
  # (see scripts/restart_worker.sh) instead of a plain restart.
  worker:
    build: .
    restart: unless-stopped
    command: celery -A celery_worker.celery worker --loglevel=info
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - FLASK_CONFIG=prod
    depends_on:
      - db
      - redis
    healthcheck:
      # Catches exactly the "stuck, not crashed" failure mode above: if no
      # worker answers a broadcast ping, this container is marked unhealthy
      # even though the process is still technically running.
      test: ["CMD-SHELL", "celery -A celery_worker.celery inspect ping --timeout 5"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Runs the periodic tasks in celery_worker.py's beat_schedule (scheduled
  # social posts, the queue-backlog check). Also needs --force-recreate on
  # restart, same reasoning as worker above.
  beat:
    build: .
    restart: unless-stopped
    command: celery -A celery_worker.celery beat --loglevel=info
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - FLASK_CONFIG=prod
    depends_on:
      - db
      - redis

  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: dealer_dashboard
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts:/docker-entrypoint-initdb.d
    ports:
      - "5435:5432"

  frontend:
    image: node:20
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./dealer_frontend_next:/app
    ports:
      - "3005:3000"
    command: sh -c "npm run build && npm run start"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=/api/v1
    depends_on:
      - web

  redis:
    image: redis:7
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  default:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: "1400"
