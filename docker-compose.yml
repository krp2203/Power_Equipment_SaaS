services:
  web:
    build: .
    restart: unless-stopped
    command: sh -c "pip install gevent && gunicorn -c gunicorn.conf.py run:app"
    volumes:
      - .:/app
    ports:
      - "8005:5000"
    env_file:
      - .env
    environment:
      - FLASK_CONFIG=prod
      - SQUARE_ACCESS_TOKEN=${SQUARE_ACCESS_TOKEN}
      - SQUARE_APP_ID=${SQUARE_APP_ID}
      - SQUARE_LOCATION_ID=${SQUARE_LOCATION_ID}
      - SQUARE_ENVIRONMENT=${SQUARE_ENVIRONMENT}
    depends_on:
      - db
      - redis

  # IMPORTANT (two separate, both real, both confirmed on this exact stack):
  # 1. `docker compose restart worker` reuses the same container hostname,
  #    which can leave the next process's Celery mingle handshake stuck
  #    waiting on stale presence data Redis still has for the dead one - the
  #    worker never crashes, it just silently stops consuming. Always
  #    redeploy with `docker compose up -d --force-recreate worker` (see
  #    scripts/restart_worker.sh) instead of a plain restart.
  # 2. Independent of #1: this Celery/kombu/redis-py combination can hang
  #    the worker's main connection inside the gossip bootstep's pidbox
  #    BRPOP loop and never reach the real task queue at all, even on a
  #    freshly-recreated container with a brand-new hostname - reproduced
  #    directly (redis MONITOR showed the worker's only BRPOP looping
  #    forever against `<id>.reply.celery.pidbox`, never once against
  #    `celery`, the real task list). --without-gossip/-mingle/-heartbeat
  #    below sidesteps it entirely; none of the three do anything useful for
  #    a single-worker deployment like this one anyway (gossip/mingle are
  #    for multi-worker awareness, heartbeat is for Flower/`celery events`,
  #    none of which this app uses). This is also why `celery inspect`/
  #    `celery status` no longer work against this worker - they rely on
  #    the same pidbox mechanism - hence the healthcheck below uses a real
  #    task round-trip instead.
  worker:
    build: .
    restart: unless-stopped
    command: celery -A celery_worker.celery worker --loglevel=info --without-gossip --without-mingle --without-heartbeat
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - FLASK_CONFIG=prod
    depends_on:
      - db
      - redis
    healthcheck:
      # Not `celery inspect ping` - with gossip disabled above it can no
      # longer answer pidbox broadcasts at all, and even before that change
      # it was an unreliable signal here (confirmed: it reported a worker
      # unhealthy in production while that same worker was demonstrably,
      # verifiably draining its queue at the time). Proves the one thing
      # that actually matters instead: a real task queued right now gets a
      # real result back.
      test: ["CMD-SHELL", "python -c 'from celery_worker import debug_task; debug_task.delay().get(timeout=10)'"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 30s

  # Runs the periodic tasks in celery_worker.py's beat_schedule (scheduled
  # social posts, the queue-backlog check). Also needs --force-recreate on
  # restart, same reasoning as worker above.
  beat:
    build: .
    restart: unless-stopped
    command: celery -A celery_worker.celery beat --loglevel=info
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - FLASK_CONFIG=prod
    depends_on:
      - db
      - redis

  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: dealer_dashboard
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts:/docker-entrypoint-initdb.d
    ports:
      - "5435:5432"

  frontend:
    image: node:20
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./dealer_frontend_next:/app
    ports:
      - "3005:3000"
    command: sh -c "npm run build && npm run start"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=/api/v1
    depends_on:
      - web

  redis:
    image: redis:7
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  default:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: "1400"
