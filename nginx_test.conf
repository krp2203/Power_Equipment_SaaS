# Test environment multi-tenancy configuration
# Mirrors production setup for local .local testing.
# HTTPS is required here (not just nice-to-have): Square's Web Payments SDK
# refuses to initialize outside a secure context, so the "Start Plan" /
# "Start My Plan" card forms only work over https://, using the self-signed
# cert Dockerfile.nginx already generates at build time.

upstream backend {
    server web:5000;
}

upstream frontend {
    server frontend:3000;
}

server {
    listen 80;
    listen 443 ssl;
    server_name bentcrankshaft.local demo.bentcrankshaft.local *.bentcrankshaft.local;

    ssl_certificate /etc/nginx/certs/self-signed.crt;
    ssl_certificate_key /etc/nginx/certs/self-signed.key;

    client_max_body_size 100M;

    # Backend API/Admin Routes (Flask) - MUST come BEFORE frontend catch-all
    location ~ ^/(api|auth|marketing|settings|admin|dashboard|dealers|cases|service_bulletins|super_admin)/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # Prevent request timeout on large uploads
        proxy_connect_timeout 90s;
        proxy_send_timeout 90s;
        proxy_read_timeout 90s;
    }

    # Everything else goes to Next.js frontend (except /static/ special handling)
    location / {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support for Next.js
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Static file serving with CORS for cross-subdomain media loading
    location /static/ {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        add_header Access-Control-Allow-Origin * always;
    }
}
